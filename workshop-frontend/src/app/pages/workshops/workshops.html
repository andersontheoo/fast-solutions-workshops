<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Workshops</h2>
    <button class="btn btn-primary" routerLink="/workshop/novo">
      + Novo Workshop
    </button>
  </div>

  <div *ngIf="error" class="alert alert-danger">
    {{ error }}
  </div>

  <div *ngIf="loading" class="text-center">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Carregando...</span>
    </div>
  </div>

  <div class="row" *ngIf="!loading">
    <div class="col-md-4 mb-3" *ngFor="let workshop of workshops">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">{{ workshop.nome }}</h5>
          <p class="card-text">{{ workshop.descricao | slice:0:100 }}</p>
          <p class="card-text">
            <small class="text-muted">
              Data: {{ workshop.dataRealizacao | date:'dd/MM/yyyy HH:mm' }}
            </small>
          </p>
          <p class="card-text">
            <small class="text-muted">
              Participantes: {{ workshop.colaboradores?.length || 0 }}
            </small>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
