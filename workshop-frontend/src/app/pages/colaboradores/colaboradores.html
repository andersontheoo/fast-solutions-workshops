<div class="container mt-4">
  <h2>Colaboradores</h2>

  <div *ngIf="loading" class="text-center">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Carregando...</span>
    </div>
  </div>

  <div *ngIf="error" class="alert alert-danger">
    {{ error }}
  </div>

  <div *ngIf="!loading && colaboradores.length === 0" class="alert alert-info">
    Nenhum colaborador cadastrado.
  </div>

  <ul class="list-group" *ngIf="!loading && colaboradores.length > 0">
    <li class="list-group-item" *ngFor="let colaborador of colaboradores">
      <strong>{{ colaborador.nome }}</strong> (ID: {{ colaborador.id }})
    </li>
  </ul>
</div>
